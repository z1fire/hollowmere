<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140f0a">
<meta name="description" content="Hollowmere - a first-person fantasy RPG where you become what you do.">
<title>Hollowmere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="icon.svg">
<script type="importmap">{ "imports": { "three": "./js/vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>

<!-- touch controls -->
<div id="touchUI" class="hidden">
  <div id="lookZone"></div>
  <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div><div id="joyHint">MOVE</div></div>
  <div id="actionBtns">
    <button id="btnAttack" class="abtn big" aria-label="Attack">⚔️</button>
    <button id="btnInteract" class="abtn" aria-label="Interact">✋</button>
    <button id="btnJump" class="abtn small" aria-label="Jump">⤒</button>
    <button id="btnHp" class="abtn small pot" aria-label="Health potion">❤</button>
    <button id="btnMp" class="abtn small pot" aria-label="Mana potion">💧</button>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="topLeft">
    <div id="classBox"><span id="className">Farmhand</span><span id="classLvl">Lv 1</span></div>
    <div class="bar hp"><div class="fill" id="hpFill"></div><span id="hpText"></span></div>
    <div class="bar mp"><div class="fill" id="mpFill"></div><span id="mpText"></span></div>
    <div id="tracker"></div>
  </div>
  <div id="topRight">
    <canvas id="minimap" width="160" height="160"></canvas>
    <div id="infoRow"><span id="gold">🪙 0</span></div>
    <div id="clock"></div>
    <div id="menuBtns">
      <button data-panel="inventory" title="Inventory (I)">🎒</button>
      <button data-panel="skills" title="Character (K)">📜</button>
      <button data-panel="quests" title="Quests (J)">📖</button>
      <button data-panel="map" title="Map (M)">🗺️</button>
      <button data-panel="menu" title="Menu (Esc)">⚙️</button>
    </div>
  </div>
  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="toasts"></div>
  <div id="banner"><h2></h2><p></p></div>
  <div id="floats"></div>
  <div id="hurt"></div>
  <div id="bottom"><div id="heldName"></div><div id="hotbar"></div></div>
</div>

<!-- panels -->
<div id="modal" class="hidden">
  <div id="panel">
    <div id="panelHead"><h2 id="panelTitle"></h2><button id="panelClose" aria-label="Close">✕</button></div>
    <div id="panelBody"></div>
  </div>
</div>

<div id="death" class="hidden"><h1>You have fallen</h1><p></p></div>
<div id="updateBanner" class="hidden"></div>

<!-- title -->
<div id="title">
  <div class="tbg"></div>
  <div class="tcontent">
    <div class="crest">⚜</div>
    <h1>Hollowmere</h1>
    <div class="sub">A Farmer's Tale</div>
    <p class="blurb">Till the soil. Take up arms. <b>Become what you do.</b></p>
    <div class="tbtns">
      <button id="btnContinue" class="primary hidden">Continue<small id="saveInfo"></small></button>
      <button id="btnNew">New Game</button>
    </div>
    <label class="tq">Graphics
      <select id="tQuality"><option value="low">Low</option><option value="med">Medium</option><option value="high">High</option></select>
    </label>
    <a id="apkLink" class="hidden" href="#">📱 Download the Android app (APK)</a>
  </div>
  <div id="ver"></div>
</div>
<div id="loading" class="hidden"><div class="spinner">⚜</div><div id="loadText">Generating the world...</div></div>

<noscript>Hollowmere needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
