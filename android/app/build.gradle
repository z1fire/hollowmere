plugins {
    id 'com.android.application'
}

// Version comes from the release tag (see .github/workflows/release.yml)
def vName = project.findProperty('versionName') ?: '0.1.0'
def vCode = (project.findProperty('versionCode') ?: '1').toInteger()
def ksFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.z1fire.hollowmere'
    compileSdk 34

    defaultConfig {
        applicationId 'com.z1fire.hollowmere'
        minSdk 26
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
