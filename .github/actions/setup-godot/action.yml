name: Setup Godot
description: Installs the Godot editor (headless) and export templates, with caching.
inputs:
  version:
    description: Godot version
    default: "4.7.2"
runs:
  using: composite
  steps:
    - name: Cache Godot + export templates
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot
          ~/.local/share/godot/export_templates
        key: godot-${{ inputs.version }}-v1
    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        V=${{ inputs.version }}
        mkdir -p ~/godot ~/.local/share/godot/export_templates/${V}.stable
        curl -sSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip
        unzip -q /tmp/godot.zip -d ~/godot
        mv ~/godot/Godot_v${V}-stable_linux.x86_64 ~/godot/godot
        curl -sSL -o /tmp/tpl.tpz https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz
        unzip -q /tmp/tpl.tpz -d /tmp/tpl
        mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${V}.stable/
        rm -rf /tmp/tpl /tmp/tpl.tpz /tmp/godot.zip
    - name: Put Godot on PATH
      shell: bash
      run: echo "$HOME/godot" >> "$GITHUB_PATH"
