name: Build & Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: ./.github/actions/setup-godot

      - name: Work out version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${{ github.run_number }}"; fi
          echo "VNAME=$V" >> "$GITHUB_ENV"
          sed -i "s/^config\/version=.*/config\/version=\"$V\"/" game/project.godot
          sed -i "s/^version\/name=.*/version\/name=\"$V\"/; s/^version\/code=.*/version\/code=${{ github.run_number }}/" game/export_presets.cfg

      - name: Android SDK paths & signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # editor settings tell Godot where the Android SDK and JDK are
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            mkdir -p ~/.config/godot
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/$f
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Import assets
        run: godot --headless --path game --import || godot --headless --path game --import

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p export
          godot --headless --path game --export-release "Android" "$GITHUB_WORKSPACE/Hollowmere.apk"
          ls -la Hollowmere.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hollowmere-${{ env.VNAME }}
          path: Hollowmere.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Hollowmere.apk
          generate_release_notes: true
          make_latest: true
