name: Deploy web version to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['game/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-godot
      - name: Stamp version
        run: |
          V=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          [ -n "$V" ] && sed -i "s/^config\/version=.*/config\/version=\"$V\"/" game/project.godot || true
      - name: Import & export web build
        run: |
          godot --headless --path game --import || godot --headless --path game --import
          mkdir -p export/web
          godot --headless --path game --export-release "Web" "$GITHUB_WORKSPACE/export/web/index.html"
          ls -la export/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/web
      - id: deployment
        uses: actions/deploy-pages@v4
